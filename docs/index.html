<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Learn Dutch — mock</title>
  <style>
    :root {
      --paper: #f4efe6;
      --ink: #1a1814;
      --muted: #6f685c;
      --line: #1a1814;
      --chip: #fff;
      --accent: #c43c2c;
      --sat: env(safe-area-inset-top, 0px);
      --sab: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #2b2924;
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }
    .phone {
      width: 100%;
      max-width: 390px;
      min-height: 100dvh;
      background: var(--paper);
      display: flex;
      flex-direction: column;
      padding: calc(16px + var(--sat)) 20px calc(20px + var(--sab));
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-family: system-ui, sans-serif;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 22px;
    }
    .top button { background: none; border: 0; color: inherit; font: inherit; cursor: pointer; letter-spacing: inherit; text-transform: inherit; text-align: left; max-width: 70%; }
    h1 { font-size: 15px; font-weight: 600; }
    .stage { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 14px; }
    .nl { font-size: 30px; line-height: 1.3; }
    .nl .hole {
      display: inline-block;
      min-width: 2.2ch;
      border-bottom: 3px solid var(--accent);
      margin: 0 2px;
    }
    .nl .hole.on { border-color: var(--ink); font-style: italic; }
    .en { font-family: system-ui, sans-serif; font-size: 16px; color: var(--muted); }
    .alts, .hits {
      display: flex; flex-wrap: wrap; gap: 8px;
    }
    .alts button, .hits button, .who button {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      background: var(--chip);
      border: 1.5px solid var(--line);
      padding: 9px 12px;
      cursor: pointer;
      color: var(--ink);
    }
    .alts button.no { color: var(--muted); border-style: dashed; background: transparent; }
    .alts button.used { visibility: hidden; }
    .bar { display: flex; gap: 10px; margin-top: 20px; }
    .bar button {
      font-family: system-ui, sans-serif;
      font-size: 15px;
      font-weight: 600;
      border: 1.5px solid var(--line);
      padding: 14px 16px;
      cursor: pointer;
    }
    #play { background: var(--paper); width: 56px; color: var(--muted); }
    #play.ready { color: var(--ink); }
    #next { flex: 1; background: var(--ink); color: var(--paper); }
    #next:disabled { opacity: .35; }
    .who h2 { font-size: 28px; line-height: 1.2; margin-bottom: 8px; }
    .who input {
      font-family: system-ui, sans-serif;
      font-size: 18px;
      width: 100%;
      padding: 12px 0;
      border: 0;
      border-bottom: 2px solid var(--ink);
      background: transparent;
      color: var(--ink);
      outline: none;
    }
    .who input::placeholder { color: #b0a898; }
    .hits { margin-top: 8px; max-height: 58vh; overflow: auto; -webkit-overflow-scrolling: touch; }
    .hits button { width: 100%; text-align: left; }
    .hint { font-family: system-ui, sans-serif; font-size: 13px; color: var(--muted); margin-top: 12px; }
    .meta { font-family: system-ui, sans-serif; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    #who, #drill { display: none; flex-direction: column; flex: 1; }
    #who.on, #drill.on { display: flex; }
  </style>
</head>
<body>
  <div class="phone">
    <div id="who" class="who on">
      <div class="top"><h1>Learn Dutch</h1><span class="meta" id="comboHint"></span></div>
      <div class="stage">
        <h2>What do you do?</h2>
        <input id="jobQ" type="text" autocomplete="off" autocapitalize="off" placeholder="Type it">
        <div class="hits" id="hits"></div>
        <p class="hint" id="jobHint">Type to filter. The whole list is below.</p>
      </div>
    </div>

    <div id="drill">
      <div class="top">
        <button type="button" id="whoBtn"></button>
        <span id="lvl"></span>
      </div>
      <div class="stage">
        <p class="en" id="en"></p>
        <p class="nl" id="nl"></p>
        <div class="alts" id="alts"></div>
      </div>
      <div class="bar">
        <button type="button" id="play" title="Hear">▶</button>
        <button type="button" id="next" disabled>Next</button>
      </div>
    </div>
  </div>
  <script>
    let JOBS = [];
    let ALL = [];

    const RANK = { A0: 0, A1: 1, A2: 2 };

    const BRICKS = {
      drink: [
        { nl: "koffie", en: "coffee", tags: ["home", "out", "work"], level: "A0" },
        { nl: "thee", en: "tea", tags: ["home", "work"], level: "A0" },
        { nl: "water", en: "water", tags: ["home", "out"], level: "A0" },
        { nl: "bier", en: "beer", tags: ["out"], level: "A0" },
      ],
      food: [
        { nl: "brood", en: "bread", tags: ["home", "out"], level: "A0" },
        { nl: "kaas", en: "cheese", tags: ["home"], level: "A0" },
        { nl: "een broodje", en: "a sandwich", tags: ["out", "work", "student"], level: "A0" },
      ],
      place: [
        { nl: "huis", en: "home", article: null, tags: ["home"], level: "A0" },
        { nl: "werk", en: "work", article: null, tags: ["work"], level: "A0" },
        { nl: "kantine", en: "canteen", article: "de", tags: ["work", "student"], level: "A0" },
        { nl: "bibliotheek", en: "library", article: "de", tags: ["student"], level: "A0" },
        { nl: "winkel", en: "shop", article: "de", tags: ["out", "home"], level: "A0" },
        { nl: "station", en: "station", article: "het", tags: ["out"], level: "A0" },
        { nl: "campus", en: "campus", article: "de", tags: ["student"], level: "A1" },
        { nl: "vergadering", en: "meeting", article: "de", tags: ["work"], level: "A1" },
      ],
      time: [
        { nl: "tien", en: "ten", tags: ["student", "work"], level: "A0" },
        { nl: "twee", en: "two", tags: ["student", "work"], level: "A0" },
        { nl: "vijf", en: "five", tags: ["work"], level: "A0" },
        { nl: "acht", en: "eight", tags: ["work", "home"], level: "A0" },
      ],
      subject: [
        { nl: "informatica", en: "computer science", tags: ["student"], level: "A1" },
        { nl: "wiskunde", en: "maths", tags: ["student"], level: "A1" },
        { nl: "Nederlands", en: "Dutch", tags: ["student", "inburgering"], level: "A0" },
      ],
      thing: [
        { nl: "laptop", en: "laptop", article: "de", tags: ["student", "work"], level: "A0" },
        { nl: "mail", en: "email", article: "de", tags: ["work"], level: "A0" },
        { nl: "sleutel", en: "key", article: "de", tags: ["home"], level: "A0" },
        { nl: "pas", en: "pass", article: "de", tags: ["student", "work", "out"], level: "A1" },
      ],
    };

    const FRAMES = [
      { id: "wil", level: "A0", tags: ["home", "out", "work", "student"],
        parts: ["Ik", "wil", "{drink}"], en: "I want {drink}." },
      { id: "ga_naar", level: "A0", tags: ["home", "out", "work", "student"],
        parts: ["Ik", "ga", "naar", "{place}"], en: "I am going to {place}." },
      { id: "waar_is", level: "A0", tags: ["out", "work", "student", "home"],
        parts: ["Waar", "is", "{place}"], en: "Where is {place}?" },
      { id: "heb_om", level: "A1", tags: ["student", "work"],
        parts: ["Ik", "heb", "het", "om", "{time}"], en: "I have it at {time}." },
      { id: "werk_tot", level: "A1", tags: ["work"],
        parts: ["Ik", "werk", "tot", "{time}"], en: "I work until {time}." },
      { id: "studeer", level: "A1", tags: ["student"],
        parts: ["Ik", "studeer", "{subject}"], en: "I study {subject}." },
      { id: "dit_is", level: "A0", tags: ["home", "work", "student"],
        parts: ["Dit", "is", "mijn", "{thing}"], en: "This is my {thing}." },
      { id: "wil_eten", level: "A0", tags: ["home", "out"],
        parts: ["Ik", "wil", "{food}"], en: "I want {food}." },
    ];

    function slotName(tok) {
      const m = /^\{(\w+)\}[.?]?$/.exec(tok);
      return m ? m[1] : null;
    }
    function withArticle(brick, frameId) {
      if (!brick.article) return brick.nl;
      if (frameId === "ga_naar" || frameId === "waar_is") return brick.article + " " + brick.nl;
      return brick.nl;
    }
    function explode() {
      const out = [];
      for (const f of FRAMES) {
        const slots = f.parts.map(slotName);
        const keys = [...new Set(slots.filter(Boolean))];
        if (!keys.length) continue;
        function rec(i, picked, tags, level) {
          if (i === keys.length) {
            const parts = f.parts.map((tok) => {
              const k = slotName(tok);
              if (!k) return tok.replace("?", "");
              const br = picked[k];
              const word = withArticle(br, f.id);
              return tok.includes("?") ? word + "?" : word;
            });
            let en = f.en;
            keys.forEach((k) => { en = en.replace("{" + k + "}", picked[k].en); });
            let words = parts.flatMap((p) => p.split(" "));
            if (f.id === "waar_is") words[words.length - 1] += "?";
            out.push({
              id: f.id + "__" + keys.map((k) => picked[k].nl).join("_"),
              frame: f.id,
              level: level,
              tags: [...new Set(tags)],
              en,
              parts: words,
            });
            return;
          }
          const k = keys[i];
          for (const br of BRICKS[k]) {
            rec(i + 1, { ...picked, [k]: br }, tags.concat(br.tags, f.tags),
              RANK[br.level] > RANK[f.level] ? br.level : f.level);
          }
        }
        rec(0, {}, f.tags.slice(), f.level);
      }
      return out;
    }

    function bootHint() {
      document.getElementById("comboHint").textContent = JOBS.length + " jobs · " + ALL.length + " phrases";
      const h = document.getElementById("jobHint");
      if (h) h.textContent = JOBS.length + " in the list. Type to filter.";
    }

    const whoEl = document.getElementById("who");
    const drillEl = document.getElementById("drill");
    const hitsEl = document.getElementById("hits");
    const jobQ = document.getElementById("jobQ");
    const nlEl = document.getElementById("nl");
    const enEl = document.getElementById("en");
    const altsEl = document.getElementById("alts");
    const whoBtn = document.getElementById("whoBtn");
    const lvlEl = document.getElementById("lvl");
    const playBtn = document.getElementById("play");
    const nextBtn = document.getElementById("next");

    let job = null;
    let cap = "A0";
    let streak = 0;
    let pool = [];
    let ix = 0;
    let built = [];
    let bag = [];
    let paid = false;

    function norm(s) { return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
    function filterJobs(q) {
      q = norm(q.trim());
      if (!q) {
        return JOBS.slice().sort((a, b) => a.label.localeCompare(b.label));
      }
      const scored = JOBS.map((j) => {
        const blob = norm(j.label + " " + j.aliases);
        let s = 0;
        if (norm(j.label).startsWith(q)) s = 3;
        else if (blob.split(" ").some((w) => w.startsWith(q))) s = 2;
        else if (blob.includes(q)) s = 1;
        return { j, s };
      }).filter((x) => x.s);
      scored.sort((a, b) => b.s - a.s || a.j.label.localeCompare(b.j.label));
      return scored.map((x) => x.j);
    }
    function renderHits() {
      const list = filterJobs(jobQ.value);
      hitsEl.innerHTML = "";
      list.forEach((j) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = j.label;
        b.onclick = () => pickJob(j);
        hitsEl.appendChild(b);
      });
    }
    function pickJob(j) {
      job = j;
      cap = "A0";
      streak = 0;
      rebuildPool();
      ix = 0;
      whoEl.classList.remove("on");
      drillEl.classList.add("on");
      whoBtn.textContent = j.label;
      deal();
    }
    function rebuildPool() {
      const tags = new Set(job.tags);
      const ranked = ALL.filter((s) => RANK[s.level] <= RANK[cap]);
      const hit = ranked.filter((s) => s.tags.some((t) => tags.has(t)));
      pool = (hit.length ? hit : ranked).slice();
      for (let i = pool.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [pool[i], pool[j]] = [pool[j], pool[i]];
      }
    }
    function card() { return pool[ix % pool.length]; }
    function distractors(parts) {
      const have = new Set(parts);
      const extra = [];
      const words = ALL.flatMap((s) => s.parts);
      let guard = 0;
      while (extra.length < 3 && guard < 80) {
        const w = words[Math.floor(Math.random() * words.length)];
        if (!have.has(w) && !extra.includes(w)) extra.push(w);
        guard++;
      }
      return extra;
    }
    function shuffle(a) {
      const x = a.slice();
      for (let i = x.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [x[i], x[j]] = [x[j], x[i]];
      }
      return x;
    }
    function deal() {
      const c = card();
      built = [];
      bag = shuffle(c.parts.concat(distractors(c.parts)));
      nextBtn.disabled = true;
      playBtn.classList.remove("ready");
      draw();
    }
    function draw() {
      const c = card();
      enEl.textContent = c.en;
      lvlEl.textContent = c.level + " · " + (ix % pool.length + 1) + "/" + pool.length;
      const holes = c.parts.map((w, n) => {
        if (n < built.length) return `<span class="hole on">${built[n]}</span>`;
        return `<span class="hole">&nbsp;</span>`;
      }).join(" ");
      nlEl.innerHTML = holes;
      altsEl.innerHTML = "";
      bag.forEach((w, n) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = w;
        if (w === "") { b.className = "used"; b.disabled = true; }
        b.onclick = () => tap(n);
        altsEl.appendChild(b);
      });
    }
    function tap(n) {
      const c = card();
      const w = bag[n];
      if (!w) return;
      const need = c.parts[built.length];
      if (w !== need) {
        altsEl.children[n].classList.add("no");
        streak = 0;
        return;
      }
      built.push(w);
      bag[n] = "";
      if (built.length === c.parts.length) {
        nextBtn.disabled = false;
        playBtn.classList.add("ready");
        streak += 1;
        if (streak >= 4 && cap === "A0") {
          cap = "A1";
          rebuildPool();
        }
      }
      draw();
    }
    jobQ.addEventListener("input", renderHits);
    jobQ.addEventListener("focus", renderHits);
    whoBtn.onclick = () => {
      drillEl.classList.remove("on");
      whoEl.classList.add("on");
      jobQ.value = "";
      renderHits();
      jobQ.focus();
    };
    nextBtn.onclick = () => {
      if (built.length !== card().parts.length) return;
      ix += 1;
      deal();
    };
    playBtn.onclick = () => {
      if (built.length !== card().parts.length) return;
      if (!paid) paid = true;
    };
    async function boot() {
      const jobs = await fetch("occupations.json").then((r) => r.json());
      JOBS = (Array.isArray(jobs) ? jobs : []).map((j) => ({
        ...j,
        aliases: Array.isArray(j.aliases) ? j.aliases.join(" ") : (j.aliases || ""),
      }));
      ALL = explode();
      bootHint();
      renderHits();
    }
    boot().catch((e) => {
      document.getElementById("comboHint").textContent = "data missing";
      console.error(e);
    });
  </script>
</body>
</html>
